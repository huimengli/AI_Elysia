<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Monitor — 爱莉希雅</title>
<style>
:root{--pink:#e8a2c7;--pink-2:#f7d4e6;--gold:#d8b46a;--lilac:#b7a6d9;--text:#efe9f2;--text-dim:#9b93a2;--bg:#181421;--danger:#e06a6a}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
#a{padding:10px 14px;border-bottom:1px solid #2b2436}
.bar{height:10px;background:#2b2436;border-radius:5px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--pink)}
.bar.gold i{background:var(--gold)}.bar.danger i{background:var(--danger)}
.lamp{display:inline-block;padding:3px 10px;margin-right:8px;border-radius:12px;background:#2b2436;font-size:13px}
.lamp.on{background:#2f5f3f}.lamp.off{background:#5f2f2f}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px}
.card{border:1px solid #2b2436;border-radius:8px;padding:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:2px 6px;text-align:left;border-bottom:1px solid #2b2436}
#logs{padding:0 14px 12px;font:12px/1.45 Consolas,monospace}
.svc{border:1px solid #2b2436;border-radius:8px;margin-top:8px}
.svc>div{padding:4px 8px;cursor:pointer;color:var(--pink-2)}
.svc pre{margin:0;padding:6px 8px;max-height:180px;overflow:auto;white-space:pre-wrap;color:var(--text-dim)}
button{background:#2b2436;color:var(--text);border:1px solid var(--lilac);border-radius:6px;padding:2px 8px}
select{width:58px;margin:0 8px;padding:2px 4px;background:#2b2436;color:var(--text);border:1px solid #2b2436;border-radius:6px}
.ext{color:var(--text-dim);font-size:12px}
</style><link rel="stylesheet" href="/static/tabs.css">
</head><body>
<div id="a">
<div id="res">读取中…</div><div class="bar" id="commitbar"><i style="width:0"></i></div>
<div id="lamps">四灯：—</div>
</div>
<div id="grid">
<div class="card"><b>服务（pid / 提交 MB / 来源）</b><table id="svc"><tr><th>服务</th><th>pid</th><th>提交MB</th><th>来源</th><th>关闭</th></tr></table></div>
<div class="card"><b>语音链路（F 块）</b><div id="f">—</div><canvas id="curve" width="360" height="60" style="width:100%"></canvas></div>
<div class="card"><b>工具统计（E 块）</b><table id="tools"><tr><th>工具</th><th>次数</th><th>失败</th><th>均耗时</th></tr></table></div>
<div class="card"><b>推送间隔（秒）</b><select id="iv">
<option>1</option><option>2</option><option>5</option><option>10</option><option>30</option></select> s
<div class="ext">照 design §3：最低 1 s；页面隐藏时自动降到 30 s 省 CPU。存 localStorage。</div></div>
</div>
<div id="logs"></div>
<script src="/static/tabs.js"></script>
<script>
const $ = (s) => document.getElementById(s);
var iv = +(localStorage.getItem("mon_interval") || 5); $("iv").value = String(iv);
var logdiv = {};
function fmt(n) { return (n === null || n === undefined) ? "—" : n; }
function send_cfg(i) {
  if (ws.readyState === 1) ws.send(JSON.stringify({type: "monitor_config", interval: i}));
}
$("iv").onchange = () => { iv = +$("iv").value; localStorage.setItem("mon_interval", String(iv)); send_cfg(iv); };
setInterval(function () { send_cfg(document.hidden ? 30 : iv); }, 10000);  // 心跳重注册（第 119 处自曝：服务端瞬时发送失败会摘掉客户端，页面会永久静默）
var ws = null;
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/ws");
  ws.onopen = () => send_cfg(document.hidden ? 30 : iv);
  ws.onmessage = (e) => { var m = JSON.parse(e.data); if (m.type === "monitor") render(m); };
  ws.onclose = () => { $("res").textContent = "WS 断开，1 秒后重连（照实：断连不算服务失败）"; setTimeout(connect, 1000); };
}
function render(m) {
  var d = m.data, o = d.os;
  $("res").textContent = "提交 " + o.commit_total + " · 已用 " + o.commit_used + " · 可用 " + o.commit_avail + " MB · 物理 " + o.phys_pct + "% · CPU " + fmt(o.cpu) + "%";
  var pct = Math.min(100, Math.round(100 * o.commit_used / o.commit_total));
  var bar = $("commitbar"); bar.className = "bar" + (o.commit_avail < 300 ? " danger" : o.commit_avail < 2000 ? " gold" : "");
  bar.firstElementChild.style.width = pct + "%";
  var L = d.lamps || {}; var s = "四灯：";
  for (var k in L) { var on = L[k] && (L[k].online === true); s += "<span class=\"lamp " + (on ? "on" : "off") + "\">" + (L[k].label || k) + "</span>"; }
  s += " 我起窗口 " + fmt(d.jarvis_windows) + "/3";
  $("lamps").innerHTML = s;
  var t = "<tr><th>服务</th><th>pid</th><th>提交MB</th><th>来源</th><th>关闭</th></tr>";
  (d.services || []).forEach(function (x) {
    var self = x.source === "jarvis 起";
    var btn = self ? "<button data-name=\"" + x.name + "\" data-pid=\"" + x.pid + "\">关闭</button>" : "<span class=\"ext\">无关闭按钮（不是本进程起的）</span>";
    t += "<tr><td>" + x.label + "</td><td>" + fmt(x.pid) + "</td><td>" + (x.mem_mb < 0 ? "—" : x.mem_mb) + "</td><td>" + x.source + "</td><td>" + btn + "</td></tr>";
  });
  $("svc").innerHTML = t;
  Array.prototype.forEach.call($("svc").querySelectorAll("button"), function (b) {
    b.onclick = function () {
      var name = b.dataset.name, pid = +b.dataset.pid;
      if (!confirm("要关 " + name + "（pid " + pid + "，jarvis 起的）？确认/取消")) return;
      fetch("/api/service/stop", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({name: name, pid: pid})});
    };
  });
  var f = "", mm = d.metrics || {};
  var last = (a) => (a && a.length ? a[a.length - 1] : null);
  f += "wake " + fmt(last(mm.wake_peak)) + " · ASR " + fmt(last(mm.asr_secs)) + " s · LLM " + fmt(last(mm.llm_secs)) + " s / " + fmt(last(mm.llm_chars)) + " 字 · TTS " + fmt(last(mm.tts_secs)) + " s";
  f += "<div class=\"ext\">照实：tokens/s 未埋（要 tokenizer），这条尺记的是耗时与字数；TTS 含合成与播放全程。</div>";
  $("f").innerHTML = f;
  var c = $("curve").getContext("2d"); c.clearRect(0, 0, 360, 60); c.fillStyle = "#e8a2c7";
  var pts = (mm.wake_peak || []).slice(-120);
  pts.forEach(function (v, i) { var h = Math.max(2, Math.round(v * 60)); c.fillRect(i * 3, 60 - h, 2, h); });
  var tt = "<tr><th>工具</th><th>次数</th><th>失败</th><th>均耗时</th></tr>";
  var ts = d.tools || {};
  for (var k in ts) tt += "<tr><td>" + k + "</td><td>" + ts[k].n + "</td><td>" + ts[k].fail + "</td><td>" + ts[k].avg + " s</td></tr>";
  $("tools").innerHTML = tt;
  (m.logs || []).forEach(function (pair) {
    var name = pair[0], lines = pair[1];
    if (!logdiv[name]) {
      var box = document.createElement("div"); box.className = "svc";
      var head = document.createElement("div"); head.textContent = "[log] " + name + "（可折叠，最新在上，环形 2,000 行）";
      var pre = document.createElement("pre");
      head.onclick = () => { pre.style.display = pre.style.display === "none" ? "block" : "none"; };
      box.appendChild(head); box.appendChild(pre); $("logs").appendChild(box); logdiv[name] = pre;
    }
    var pre = logdiv[name];
    lines.forEach(function (l) { pre.textContent = l[0] + " " + l[1] + "\n" + pre.textContent; });
  });
}
connect();
</script></body></html>
