<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>监视界面 — 爱莉希雅</title>
<style>
:root{
  --pink:#F8A9C4; --pink-2:#FFD8E8; --rose:#7E3F66; --lilac:#C9B7E0; --gold:#F2C9A8;
  --bg0:#171021; --bg1:#1d1428; --glass:rgba(255,255,255,0.055); --glass-2:rgba(255,255,255,0.10);
  --line:rgba(248,169,196,0.34); --line-2:rgba(201,183,224,0.28);
  --text:#F6ECF2; --text-dim:#CDBCC8; --shadow:0 10px 34px rgba(20,10,30,0.45); --danger:#e06a6a;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{height:auto;}
/* 第 1 条（2026-11-22-11-48-11）：配色/字体/面板照 home（index.html 的 :root 与渐变玻璃卡）；
   第 4 条：body 不再 overflow:hidden，允许上下滚动（日志区也各自可滚）。 */
body{
  background:
    radial-gradient(1100px 700px at 12% -12%, #2c1c3c 0%, transparent 62%),
    radial-gradient(900px 620px at 100% 0%, rgba(248,169,196,0.20), transparent 58%),
    radial-gradient(700px 520px at 50% 120%, rgba(201,183,224,0.16), transparent 60%),
    linear-gradient(165deg, var(--bg0), var(--bg1) 58%, #150f1f);
  color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow-y:auto; overflow-x:hidden; letter-spacing:0.02em;
}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:2px;z-index:9;
  background:linear-gradient(90deg,transparent,var(--pink),var(--lilac),var(--gold),transparent);opacity:0.75;}
#a{margin:44px 20px 0;padding:14px 22px;border-radius:16px;
  background:linear-gradient(120deg,rgba(126,63,102,0.30),rgba(255,255,255,0.06));
  border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(14px);}
.bar{height:10px;background:var(--glass-2);border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink-2),var(--pink))}
.bar.gold i{background:linear-gradient(90deg,var(--gold),#E8B87A)}
.bar.danger i{background:linear-gradient(90deg,#F08A8A,var(--danger))}
/* 第 1 条（2026-11-22-13-48-06 照你逐字「monitor的4灯不明显,需要修改一下」）：灯体加大、加外圈光晕与
   文字提亮；判定来源照实复用 snapshot() 的 lamps，不改判定逻辑。 */
.lamp{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;margin:0 10px 6px 0;
  border-radius:999px;border:1.5px solid var(--line-2);background:rgba(120,110,125,0.20);
  font-size:15px;font-weight:600;color:var(--text-dim)}
.lamp::before{content:"";width:12px;height:12px;border-radius:50%;background:#6b6470;flex:0 0 12px}
.lamp.on{background:rgba(96,190,140,0.34);border-color:rgba(140,230,170,0.62);color:#EAF6EE;
  box-shadow:0 0 14px rgba(120,220,160,0.45)}
.lamp.on::before{background:#7CE2A6;box-shadow:0 0 12px 3px rgba(124,226,166,0.85)}
.lamp.off{background:rgba(210,96,96,0.32);border-color:rgba(240,140,140,0.62);color:#F7E3E3;
  box-shadow:0 0 14px rgba(220,110,110,0.40)}
.lamp.off::before{background:#E87A7A;box-shadow:0 0 12px 3px rgba(232,122,122,0.80)}
#lamps{font-size:15px;line-height:1.8}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 20px}
.card{border:1px solid var(--line);border-radius:16px;padding:10px 12px;
  background:linear-gradient(120deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));
  box-shadow:var(--shadow);backdrop-filter:blur(10px)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:2px 6px;text-align:left;border-bottom:1px solid var(--line-2)}
#logs{padding:0 20px 16px;font:12px/1.45 Consolas,monospace}
.svc{border:1px solid var(--line-2);border-radius:16px;margin-top:8px;
  background:linear-gradient(120deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));box-shadow:var(--shadow)}
.svc>div{padding:6px 12px;cursor:pointer;color:var(--pink-2)}
.svc pre{margin:0;padding:6px 12px;max-height:220px;overflow:auto;white-space:pre-wrap;color:var(--text-dim)}
button{background:var(--glass-2);color:var(--text);border:1px solid var(--lilac);border-radius:8px;padding:2px 10px}
select{width:64px;margin:0 8px;padding:2px 4px;background:var(--glass-2);color:var(--text);border:1px solid var(--line-2);border-radius:8px}
.ext{color:var(--text-dim);font-size:12px}
/* 第 3 条（照你 13:48 逐字给的 CSS，一个数值不改） */
*::-webkit-scrollbar{
    background-color:rgb(255 5 5 / 30%);
    width:12px
}

*::-webkit-scrollbar-thumb{
    background-color: rgb(41 73 144 / 30%);
    border: 2px solid snow;
    border-radius: 10px;
}
</style><link rel="stylesheet" href="/static/tabs.css">
</head><body>
<div id="a">
<div id="res">读取中…</div><div class="bar" id="commitbar"><i style="width:0"></i></div>
<div id="lamps">四灯：—</div>
</div>
<div id="grid">
<div class="card"><b>服务（pid / 提交 MB / 来源）</b><table id="svc"><tr><th>服务</th><th>pid</th><th>提交MB</th><th>来源</th><th>关闭</th></tr></table></div>
<div class="card"><b>语音链路（F 块）</b><div id="f">—</div><canvas id="curve" width="360" height="60" style="width:100%"></canvas></div>
<div class="card"><b>工具统计（E 块）</b><table id="tools"><tr><th>工具</th><th>次数</th><th>失败</th><th>均耗时</th></tr></table></div>
<div class="card"><b>推送间隔（秒）</b><select id="iv">
<option>1</option><option>2</option><option>5</option><option>10</option><option>30</option></select> s
<div class="ext">照 design §3：最低 1 s；页面隐藏时自动降到 30 s 省 CPU。存 localStorage。</div></div>
</div>
<div id="logs"></div>
<script src="/static/tabs.js"></script>
<script>
const $ = (s) => document.getElementById(s);
var iv = +(localStorage.getItem("mon_interval") || 5); $("iv").value = String(iv);
var logdiv = {};
var logbuf = {};
var LBL = {jarvis: "爱莉希雅"};  // 第 2 条：页上显示「爱莉希雅」，环与文件的 key 照实是 jarvis
var LOGCAP = 200;  // 第 5 条：进 monitor 后每面板只显示 200 行（全量在环与 .tmp/<name>.log）
function sortByTime(buf) {
  /* 第 209 处自曝照实坐实：100 ms 即时通道与 1 s 拍共用游标，两条发送的到达顺序无保证，
     页上到达序可倒置（面板快照里出现过 14:28:16 排在 14:20:01 之前）。这里按时间戳稳定排序：
     同秒的行保持到达先后（ES2019 sort 是稳定的），保证「最新在下」是时间序。 */
  buf.sort(function (a, b) { return a[0] < b[0] ? -1 : (a[0] > b[0] ? 1 : 0); });
  return buf;
}

function appendLogs(pairs) {
  (pairs || []).forEach(function (pair) {
    var name = pair[0], lines = pair[1];
    ensurePanel(name);  // 即时增量也要建面板（第 198 处自曝缺口）
    var buf = logbuf[name] || [];
    for (var i = 0; i < lines.length; i++) buf.push(lines[i]);
    if (buf.length > LOGCAP) buf.splice(0, buf.length - LOGCAP);  // 保留最新 200 行（第 192 处方向修正）
    sortByTime(buf);
    logbuf[name] = buf;
    if (follow[name]) flush(name);  // 查看态冻结视野
  });
}

var follow = {};  // 第 2 条两态：true=最新追加（滚到底自动跟），false=查看（冻结视野看历史）
var stateDiv = {};  // 每面板的状态文字（查看 / 最新追加）
function ensurePanel(name) {
  if (logdiv[name]) { return; }
  var box = document.createElement("div"); box.className = "svc";
  var head = document.createElement("div");
  head.textContent = "[log] " + (LBL[name] || name) + "（可折叠，最新在下；页面显示上限 200 行，全量写 .tmp/" + name + ".log）";
  var mode = document.createElement("button"); mode.textContent = "最新追加"; mode.style.margin = "0 0 0 8px";
  mode.onclick = function (ev) {
    ev.stopPropagation();
    follow[name] = !follow[name];
    mode.textContent = follow[name] ? "最新追加" : "查看";
    stateDiv[name].textContent = follow[name] ? "状态：最新追加（滚到底，新行落底部）" : "状态：查看（视野冻结，向上滚看历史，最多 200 行）";
    if (follow[name]) { flush(name); }
  };
  head.appendChild(mode);
  var st = document.createElement("span"); st.className = "ext"; st.textContent = "状态：最新追加（滚到底，新行落底部）";
  head.appendChild(st); stateDiv[name] = st;
  var pre = document.createElement("pre");
  head.onclick = () => { pre.style.display = pre.style.display === "none" ? "block" : "none"; };
  pre.onscroll = function () {
    var atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight <= 2;
    follow[name] = atBottom;
    mode.textContent = atBottom ? "最新追加" : "查看";
    st.textContent = atBottom ? "状态：最新追加（滚到底，新行落底部）" : "状态：查看（视野冻结，向上滚看历史，最多 200 行）";
    if (atBottom) flush(name);
  };
  box.appendChild(head); box.appendChild(pre); $("logs").appendChild(box); logdiv[name] = pre;
  follow[name] = true;
}

function flush(name) {
  var buf = logbuf[name] || [];
  var pre = logdiv[name];
  /* 第 6 条（第 168 处坐实）：每拍只赋值一次，禁每行 `pre.textContent = 新行 + 旧文本`（整段复制，越久越卡） */
  pre.textContent = buf.map(function (l) { return l[0] + " " + l[1]; }).join("\n");
  pre.scrollTop = pre.scrollHeight;  // 最新在下：追加后停在底部
}

function fmt(n) { return (n === null || n === undefined) ? "—" : n; }
function send_cfg(i) {
  if (ws.readyState === 1) ws.send(JSON.stringify({type: "monitor_config", interval: i}));
}
$("iv").onchange = () => { iv = +$("iv").value; localStorage.setItem("mon_interval", String(iv)); send_cfg(iv); };
setInterval(function () { send_cfg(document.hidden ? 30 : iv); }, 10000);  // 心跳重注册（第 119 处自曝：服务端瞬时发送失败会摘掉客户端，页面会永久静默）
var ws = null;
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/ws");
  ws.onopen = () => send_cfg(document.hidden ? 30 : iv);
  ws.onmessage = (e) => { var m = JSON.parse(e.data); if (m.type === "monitor") render(m); else if (m.type === "logchunk") appendLogs(m.logs); };  // 第 5 条（13:48）：即时增量走同一条缓冲与 200 行上限
  ws.onclose = () => { $("res").textContent = "WS 断开，1 秒后重连（照实：断连不算服务失败）"; setTimeout(connect, 1000); };
}
function render(m) {
  var d = m.data, o = d.os;
  $("res").textContent = "提交 " + o.commit_total + " · 已用 " + o.commit_used + " · 可用 " + o.commit_avail + " MB · 物理 " + o.phys_pct + "% · CPU " + fmt(o.cpu) + "%";
  var pct = Math.min(100, Math.round(100 * o.commit_used / o.commit_total));
  var bar = $("commitbar"); bar.className = "bar" + (o.commit_avail < 300 ? " danger" : o.commit_avail < 2000 ? " gold" : "");
  bar.firstElementChild.style.width = pct + "%";
  var L = d.lamps || {}; var s = "四灯：";
  for (var k in L) { var on = L[k] && (L[k].online === true); s += "<span class=\"lamp " + (on ? "on" : "off") + "\">" + (L[k].label || k) + "</span>"; }
  s += " 我起窗口 " + fmt(d.jarvis_windows) + "/3";
  $("lamps").innerHTML = s;
  var t = "<tr><th>服务</th><th>pid</th><th>提交MB</th><th>来源</th><th>关闭</th></tr>";
  (d.services || []).forEach(function (x) {
    var self = x.source === "jarvis 起";
    var btn = self ? "<button data-name=\"" + x.name + "\" data-pid=\"" + x.pid + "\">关闭</button>" : "<span class=\"ext\">无关闭按钮（不是本进程起的）</span>";
    t += "<tr><td>" + x.label + "</td><td>" + fmt(x.pid) + "</td><td>" + (x.mem_mb < 0 ? "—" : x.mem_mb) + "</td><td>" + x.source + "</td><td>" + btn + "</td></tr>";
  });
  $("svc").innerHTML = t;
  Array.prototype.forEach.call($("svc").querySelectorAll("button"), function (b) {
    b.onclick = function () {
      var name = b.dataset.name, pid = +b.dataset.pid;
      if (!confirm("要关 " + name + "（pid " + pid + "，jarvis 起的）？确认/取消")) return;
      fetch("/api/service/stop", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({name: name, pid: pid})});
    };
  });
  var f = "", mm = d.metrics || {};
  var last = (a) => (a && a.length ? a[a.length - 1] : null);
  f += "wake " + fmt(last(mm.wake_peak)) + " · ASR " + fmt(last(mm.asr_secs)) + " s · LLM " + fmt(last(mm.llm_secs)) + " s / " + fmt(last(mm.llm_chars)) + " 字 · TTS " + fmt(last(mm.tts_secs)) + " s · 总用时 " + fmt(last(mm.total_secs)) + " s";
  f += "<div class=\"ext\">照实：tokens/s 未埋（要 tokenizer）；总用时 = 唤醒确认 → 播放结束（含 ASR、LLM、TTS 合成与播放）；TTS 含合成与播放全程。</div>";
  $("f").innerHTML = f;
  var c = $("curve").getContext("2d"); c.clearRect(0, 0, 360, 60); c.fillStyle = "#e8a2c7";
  var pts = (mm.wake_peak || []).slice(-120);
  pts.forEach(function (v, i) { var h = Math.max(2, Math.round(v * 60)); c.fillRect(i * 3, 60 - h, 2, h); });
  var tt = "<tr><th>工具</th><th>次数</th><th>失败</th><th>均耗时</th></tr>";
  var ts = d.tools || {};
  for (var k in ts) tt += "<tr><td>" + k + "</td><td>" + ts[k].n + "</td><td>" + ts[k].fail + "</td><td>" + ts[k].avg + " s</td></tr>";
  $("tools").innerHTML = tt;
  appendLogs(m.logs);  // 第 2/5 条（13:48）：1 s 拍与 100 ms 即时通道共用同一条路径（建面板、200 行上限、时间序、两态）
}
connect();
</script></body></html>
