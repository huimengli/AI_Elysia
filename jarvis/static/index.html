<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爱莉希雅</title>
<style>
:root{
    --pink:#F8A9C4; --pink-2:#FFD8E8; --rose:#7E3F66; --lilac:#C9B7E0; --gold:#F2C9A8;
    --bg0:#171021; --bg1:#1d1428; --glass:rgba(255,255,255,0.055); --glass-2:rgba(255,255,255,0.10);
    --line:rgba(248,169,196,0.34); --line-2:rgba(201,183,224,0.28);
    --text:#F6ECF2; --text-dim:#CDBCC8; --shadow:0 10px 34px rgba(20,10,30,0.45);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1100px 700px at 12% -12%, #2c1c3c 0%, transparent 62%),
      radial-gradient(900px 620px at 100% 0%, rgba(248,169,196,0.20), transparent 58%),
      radial-gradient(700px 520px at 50% 120%, rgba(201,183,224,0.16), transparent 60%),
      linear-gradient(165deg, var(--bg0), var(--bg1) 58%, #150f1f);
    color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden; letter-spacing:0.02em;
  }
  /* 樱花飘落层 */
  .particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .particle{
    position:absolute;top:-6vh;width:14px;height:14px;border-radius:60% 40% 55% 45%;
    background:linear-gradient(140deg,var(--pink-2),var(--pink) 60%,var(--rose));
    box-shadow:0 0 14px rgba(248,169,196,0.55);opacity:0.55;
    animation:petal 16s linear infinite;
  }
  .particle:nth-child(1){left:8%;animation-duration:13s;}
  .particle:nth-child(2){left:22%;animation-duration:18s;animation-delay:-4s;width:10px;height:10px;}
  .particle:nth-child(3){left:37%;animation-duration:15s;animation-delay:-8s;}
  .particle:nth-child(4){left:52%;animation-duration:20s;animation-delay:-2s;width:11px;height:11px;}
  .particle:nth-child(5){left:66%;animation-duration:14s;animation-delay:-6s;}
  .particle:nth-child(6){left:78%;animation-duration:19s;animation-delay:-10s;width:9px;height:9px;}
  .particle:nth-child(7){left:90%;animation-duration:17s;animation-delay:-5s;}
  .particle:nth-child(8){left:45%;animation-duration:22s;animation-delay:-12s;width:12px;height:12px;}
  @keyframes petal{
    0%{transform:translateY(-8vh) translateX(0) rotate(0deg);opacity:0;}
    10%{opacity:0.55;}
    50%{transform:translateY(52vh) translateX(30px) rotate(180deg);}
    100%{transform:translateY(108vh) translateX(-16px) rotate(360deg);opacity:0.12;}
  }
  @media (prefers-reduced-motion: reduce){
    .particle{animation:none;opacity:0.22;} .activity-spinner{animation:none;}
    .arc-ring,.arc-ring-2,.r-outer,.r-mid,.r-inner{animation:none;}
  }
  /* 顶部樱粉条 */
  body::before{
    content:"";position:fixed;left:0;right:0;top:0;height:2px;z-index:9;
    background:linear-gradient(90deg,transparent,var(--pink),var(--lilac),var(--gold),transparent);
    opacity:0.75;
  }
  /* Header */
  .header{
    position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px;margin:16px 20px 0;border-radius:16px;
    background:linear-gradient(120deg,rgba(126,63,102,0.30),rgba(255,255,255,0.06));
    border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(14px);
  }
  .header-left{display:flex;align-items:center;gap:14px;}
  .logo-wrapper{display:flex;align-items:center;gap:12px;}
  .logo-icon{width:38px;height:38px;filter:drop-shadow(0 0 8px rgba(248,169,196,0.6));}
  .logo-icon svg{width:100%;height:100%;}
  .arc-ring,.arc-ring-2,.arc-core{fill:none;stroke:var(--pink);stroke-width:1.2;}
  .arc-ring-2{stroke:var(--lilac);} .arc-core{fill:var(--pink-2);stroke:none;}
  .arc-ring{animation:spin 14s linear infinite;transform-origin: center center;} .arc-ring-2{animation:spin 9s linear infinite reverse;transform-origin: center center;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .logo{font-size:20px;font-weight:700;letter-spacing:0.16em;
    background:linear-gradient(90deg,var(--pink-2),var(--pink) 55%,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .logo-version{font-size:11px;color:var(--text-dim);letter-spacing:0.14em;margin-top:2px;}
  .status-badge{
    display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;
    background:var(--glass);border:1px solid var(--line-2);font-size:12px;color:var(--text-dim);}
  .status-dot{width:9px;height:9px;border-radius:50%;background:var(--lilac);box-shadow:0 0 10px var(--lilac);}
  .status-dot.online{background:var(--pink-2);box-shadow:0 0 12px var(--pink);}
.state-display{display:flex;gap:4px;flex-wrap:wrap;}
.state-chip{font-size:10px;letter-spacing:1px;padding:2px 7px;border:1px solid rgba(248,169,153,.25);border-radius:999px;color:#9a8fa8;opacity:.5;white-space:nowrap;}
.state-chip.active{color:var(--pink);border-color:var(--pink-2);opacity:1;box-shadow:0 0 10px rgba(248,169,153,.35);}
  .status-dot.thinking{background:var(--gold);box-shadow:0 0 12px var(--gold);}
  /* 服务在线小灯（语音识别 / LLM / TTS），由 /api/health 5s 轮询驱动 */
  .svc-lamps{display:flex;align-items:center;gap:7px;margin-left:6px;}
  .svc-lamp{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-dim);
    padding:3px 9px;border:1px solid var(--line-2);border-radius:999px;background:var(--glass);white-space:nowrap;}
  .svc-lamp .dot{width:7px;height:7px;border-radius:50%;background:#5f5566;transition:background .2s,box-shadow .2s;}
  .svc-lamp.off{color:#8b7f8c;} .svc-lamp.off .dot{background:#5f5566;box-shadow:none;}
  .svc-lamp.warm{color:var(--gold);} .svc-lamp.warm .dot{background:var(--gold);box-shadow:0 0 8px var(--gold);}
  .svc-lamp.on{color:var(--pink-2);border-color:var(--pink-2);}
  .svc-lamp.on .dot{background:var(--pink-2);box-shadow:0 0 9px var(--pink);}

  .header-right{display:flex;align-items:center;gap:12px;}
  .model-select{
    appearance:none;padding:7px 14px;border-radius:12px;color:var(--text);font-size:13px;
    background:linear-gradient(120deg,rgba(126,63,102,0.35),rgba(255,255,255,0.08));
    border:1px solid var(--line);outline:none;}
  .model-select option{background:#1d1428;color:var(--text);}
  .hud-btn{
    position:relative;width:38px;height:38px;border-radius:12px;cursor:pointer;
    background:linear-gradient(120deg,rgba(248,169,196,0.22),rgba(255,255,255,0.06));
    border:1px solid var(--line);color:var(--pink-2);font-size:15px;}
  .hud-btn:hover{box-shadow:0 0 14px rgba(248,169,196,0.45);}
  .mute-slash{position:absolute;left:50%;top:50%;width:22px;height:2px;background:var(--gold);
    transform:translate(-50%,-50%) rotate(-45deg);opacity:0;}
  .hud-btn.muted .mute-slash{opacity:1;}
  /* Main */
  .main{position:relative;z-index:2;display:flex;gap:18px;padding:16px 20px;height:calc(100vh - 92px);}
  .chat-panel{
    flex:1;display:flex;flex-direction:column;gap:12px;border-radius:18px;padding:16px;
    background:linear-gradient(160deg,rgba(255,255,255,0.07),rgba(126,63,102,0.18));
    border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(16px);}
  .reactor-hero{display:flex;justify-content:center;padding:4px 0 2px;}
  .reactor{position:relative;width:110px;height:110px;display:grid;place-items:center;
    filter:drop-shadow(0 0 12px rgba(248,169,196,0.45));}
  .reactor svg{width:100%;height:100%;}
  .r-outer,.r-mid,.r-inner{fill:none;stroke-width:1.1;}
  .r-outer{stroke:rgba(248,169,196,0.55);animation:spin 22s linear infinite;transform-origin: center center;}
  .r-mid{stroke:rgba(201,183,224,0.55);}
  .r-inner{stroke:rgba(255,216,232,0.35);}
  .r-core{fill:var(--pink);} .r-core-ring{fill:none;stroke:rgba(255,216,232,0.4);}
  .reactor.thinking .r-core{fill:var(--gold);} .reactor.thinking .r-outer{animation-duration:6s;}
  .reactor.listening .r-core{fill:var(--lilac);} .reactor.speaking .r-core{fill:var(--pink-2);}
  .reactor-label{position:absolute;bottom:-10px;font-size:11px;letter-spacing:0.2em;color:var(--text-dim);}
  /* 消息 */
  .messages{flex:1;overflow-y:auto;padding:6px 4px;display:flex;flex-direction:column;gap:10px;}
  .messages::-webkit-scrollbar{width:8px;}
  .messages::-webkit-scrollbar-thumb{background:linear-gradient(var(--pink),var(--rose));border-radius:8px;}
  .messages::-webkit-scrollbar-track{background:transparent;}
  .msg-wrapper{display:flex;flex-direction:column;gap:4px;}
  .msg-wrapper.right{align-items:flex-end;} .msg-wrapper.left{align-items:flex-start;}
  .msg-wrapper.center{align-items:center;}
  .msg-source{font-size:10px;letter-spacing:0.14em;color:var(--text-dim);}
  .msg-source.voice{color:var(--lilac);} .msg-source.web{color:var(--gold);}
  .msg{max-width:78%;padding:11px 14px;border-radius:16px;line-height:1.55;font-size:14px;}
  .msg.user{
    background:linear-gradient(135deg,rgba(255,216,232,0.92),rgba(255,255,255,0.86));
    color:#3d2233;border:1px solid rgba(255,255,255,0.5);border-top-right-radius:5px;
    box-shadow:0 6px 18px rgba(255,216,232,0.22);}
  .msg.assistant{
    background:linear-gradient(135deg,rgba(126,63,102,0.55),rgba(248,169,196,0.30));
    color:var(--text);border:1px solid var(--line);border-top-left-radius:5px;
    box-shadow:0 6px 20px rgba(126,63,102,0.35);}
  .msg.assistant::before{content:"✦ ";color:var(--pink-2);}
  .msg.system{
    background:var(--glass);color:var(--text-dim);font-size:12.5px;border:1px dashed var(--line-2);
    padding:7px 12px;border-radius:12px;}
  .msg.tool-call{
    background:linear-gradient(135deg,rgba(201,183,224,0.24),rgba(255,255,255,0.06));
    border:1px solid var(--line-2);font-family:ui-monospace,Consolas,monospace;font-size:12.5px;}
  .tool-name{color:var(--gold);font-weight:600;}
  .tool-result{margin-top:6px;padding:6px 10px;border-radius:10px;font-size:12px;
    background:rgba(255,255,255,0.07);color:var(--text-dim);border-left:2px solid var(--pink);}
  /* Activity bar */
  .activity-bar{
    display:none;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;
    background:linear-gradient(120deg,rgba(248,169,196,0.20),rgba(255,255,255,0.06));
    border:1px solid var(--line);font-size:12.5px;color:var(--text-dim);}
  .activity-bar.active{display:flex;}
  .activity-spinner{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);
    border-top-color:var(--pink);animation:spin 0.9s linear infinite;}
  .activity-steps{display:flex;gap:5px;margin-left:auto;}
  .activity-step{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.15);}
  .activity-step.done{background:var(--pink);} .activity-step.active{background:var(--gold);box-shadow:0 0 9px var(--gold);}
  /* Input */
  .input-bar{display:flex;gap:10px;align-items:center;}
  .input-wrapper{flex:1;position:relative;}
  #input{
    width:100%;padding:12px 16px;border-radius:14px;color:var(--text);font-size:14px;
    background:rgba(255,255,255,0.07);border:1px solid var(--line-2);outline:none;}
  #input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(248,169,196,0.18);}
  #input::placeholder{color:rgba(205,188,200,0.65);}
  .input-wave{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;gap:2px;align-items:flex-end;height:16px;}
  .wave-bar{width:2px;height:6px;background:var(--pink);border-radius:2px;opacity:0.6;}
  .input-wave:after{content:"";position:absolute;right:-4px;bottom:0;width:2px;height:12px;background:var(--lilac);opacity:0.4;}
  .btn{padding:11px 18px;border-radius:14px;border:1px solid var(--line);cursor:pointer;font-size:13px;letter-spacing:0.1em;}
  .btn-stop{background:linear-gradient(120deg,rgba(126,63,102,0.55),rgba(255,255,255,0.08));color:var(--text);}
  .btn-send{background:linear-gradient(120deg,var(--pink),var(--gold));color:#3d2233;border-color:transparent;font-weight:600;}
  .btn:hover{box-shadow:0 0 16px rgba(248,169,196,0.5);transform:translateY(-1px);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;box-shadow:none;}
  /* Side panel */
  .side-panel{width:380px;display:flex;flex-direction:column;border-radius:18px;
    background:linear-gradient(160deg,rgba(255,255,255,0.06),rgba(126,63,102,0.20));
    border:1px solid var(--line-2);box-shadow:var(--shadow);backdrop-filter:blur(16px);overflow:hidden;}
  .side-header{padding:14px 16px;border-bottom:1px solid var(--line-2);}
  .side-title{font-size:13px;letter-spacing:0.18em;color:var(--pink-2);}
  .side-tabs{display:flex;gap:6px;padding:10px 12px;}
  .side-tab{flex:1;padding:8px 6px;border-radius:12px;cursor:pointer;font-size:12.5px;
    background:rgba(255,255,255,0.05);border:1px solid transparent;color:var(--text-dim);}
  .side-tab:hover{color:var(--text);border-color:var(--line-2);}
  .side-tab.active{background:linear-gradient(120deg,rgba(248,169,196,0.30),rgba(255,255,255,0.08));
    border-color:var(--line);color:var(--pink-2);}
  .side-content{flex:1;overflow-y:auto;padding:12px;}
  .side-content::-webkit-scrollbar{width:8px;}
  .side-content::-webkit-scrollbar-thumb{background:linear-gradient(var(--pink),var(--rose));border-radius:8px;}
  .tab-panel{display:none;} .tab-panel.active{display:block;}
  .section-label{font-size:11px;letter-spacing:0.16em;color:var(--text-dim);margin:10px 0 6px;}
  .quick-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .quick-btn{padding:8px 12px;border-radius:12px;cursor:pointer;font-size:12.5px;
    background:linear-gradient(120deg,rgba(201,183,224,0.20),rgba(255,255,255,0.06));
    border:1px solid var(--line-2);color:var(--text);}
  .quick-btn:hover{border-color:var(--pink);box-shadow:0 0 12px rgba(248,169,196,0.35);}
  .empty-hint{font-size:11.5px;letter-spacing:0.14em;color:var(--text-dim);opacity:0.7;padding:10px 2px;}
  .tool-log,.live-feed{display:flex;flex-direction:column;gap:8px;}
  .tool-log-entry{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,0.05);
    border-left:2px solid var(--pink);}
  .tl-name{font-family:ui-monospace,Consolas,monospace;color:var(--gold);font-size:12.5px;}
  .tl-result{font-size:11.5px;color:var(--text-dim);margin-top:4px;}
  .feed-entry{padding:6px 10px;border-radius:10px;font-size:12.5px;background:rgba(255,255,255,0.04);border-left:2px solid var(--lilac);}
  .feed-user{border-left-color:var(--pink-2);} .feed-assistant{border-left-color:var(--pink);}
  .feed-tool{border-left-color:var(--gold);} .feed-system{border-left-color:var(--lilac);color:var(--text-dim);}
  /* Settings */
  .settings-group{border-radius:14px;padding:12px;margin-bottom:12px;
    background:rgba(255,255,255,0.05);border:1px solid var(--line-2);}
  .settings-group-title{font-size:11.5px;letter-spacing:0.16em;color:var(--pink-2);margin-bottom:8px;}
  .setting-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .setting-label{flex:0 0 96px;font-size:12.5px;color:var(--text-dim);}
  .setting-input,.setting-select{flex:1;padding:8px 10px;border-radius:10px;color:var(--text);
    background:rgba(255,255,255,0.07);border:1px solid var(--line-2);outline:none;font-size:13px;}
  .setting-input:focus,.setting-select:focus{border-color:var(--pink);}
  .setting-select option{background:#1d1428;}
  .settings-btn{padding:8px 14px;border-radius:12px;cursor:pointer;font-size:12.5px;
    background:linear-gradient(120deg,rgba(201,183,224,0.22),rgba(255,255,255,0.06));
    border:1px solid var(--line-2);color:var(--text);}
  .settings-btn.primary{background:linear-gradient(120deg,var(--pink),var(--gold));color:#3d2233;border-color:transparent;font-weight:600;}
  .settings-btn:hover{box-shadow:0 0 12px rgba(248,169,196,0.4);}
  .settings-save-toast{margin-top:10px;padding:10px;border-radius:12px;text-align:center;font-size:12.5px;
    background:rgba(248,169,196,0.20);border:1px solid var(--line);opacity:0;transition:opacity .3s;}
  .settings-save-toast.show{opacity:1;}
  .provider-card{border-radius:12px;padding:10px;margin-bottom:8px;background:rgba(255,255,255,0.05);border:1px solid var(--line-2);}
  .provider-card.active-provider{border-color:var(--pink);box-shadow:0 0 14px rgba(248,169,196,0.30);}
  .provider-card-header{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .provider-card-name{font-size:13px;}
  .provider-card-badge{font-size:10.5px;padding:2px 8px;border-radius:999px;background:linear-gradient(120deg,var(--pink),var(--gold));color:#3d2233;}
  .provider-card-actions{display:flex;gap:6px;}
  .provider-card-actions button{padding:4px 8px;border-radius:9px;cursor:pointer;color:var(--text);
    background:rgba(255,255,255,0.07);border:1px solid var(--line-2);}
  .provider-card-actions button:hover{border-color:var(--pink);}
  .del-btn{color:var(--pink-2)!important;}
  .provider-card-detail{font-size:11.5px;color:var(--text-dim);margin-top:4px;font-family:ui-monospace,Consolas,monospace;}
  /* Modal */
  .modal-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;
    background:rgba(12,7,18,0.62);backdrop-filter:blur(6px);}
  .modal-overlay.show{display:flex;}
  .modal{width:min(560px,92vw);border-radius:18px;padding:22px;
    background:linear-gradient(160deg,rgba(29,20,40,0.96),rgba(126,63,102,0.35));
    border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,0.55);}
  .modal-title{font-size:16px;letter-spacing:0.14em;color:var(--pink-2);margin-bottom:14px;}
  .modal-btns{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;}
</style>
</head>
<body>

<div class="particles">
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div>
</div>

<div class="header">
  <div class="header-left">
    <div class="logo-wrapper">
      <div class="logo-icon">
        <svg viewBox="0 0 32 32">
          <circle class="arc-ring" cx="16" cy="16" r="14" stroke-dasharray="6 4" />
          <circle class="arc-ring-2" cx="16" cy="16" r="11" stroke-dasharray="3 5" />
          <circle class="arc-core" cx="16" cy="16" r="4" />
          <circle fill="none" cx="16" cy="16" r="6" stroke="rgba(0,212,255,0.3)" stroke-width="0.5" />
        </svg>
      </div>
      <div>
        <div class="logo">爱莉希雅</div>
        <div class="logo-version">逐火十三英桀 · 刻印「饰品」</div>
      </div>
    </div>
    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <!-- 用户定稿（2026-11-09-15-37-58）：顶部状态显示器 = 待命中 / 已离线 / 聆听中 /
           说话中 / 执行中 / 思考中；statusText 保留为细粒度说明（工具名、在。…） -->
      <div class="state-display" id="stateDisplay">
        <span class="state-chip active" data-state="idle">待命中</span>
        <span class="state-chip" data-state="offline">已离线</span>
        <span class="state-chip" data-state="listening">聆听中</span>
        <span class="state-chip" data-state="speaking">说话中</span>
        <span class="state-chip" data-state="acting">执行中</span>
        <span class="state-chip" data-state="thinking">思考中</span>
      </div>
      <span id="statusText">启动中</span>
      <!-- 右侧三盏灯：语音识别 / LLM / TTS（/api/health，5 s 轮询） -->
      <div class="svc-lamps" id="svcLamps">
        <div class="svc-lamp off" id="lamp-asr" title="语音识别：faster-whisper（进程内，首次识别后常驻）"><span class="dot"></span>语音识别</div>
        <div class="svc-lamp off" id="lamp-llm" title="LLM：当前 provider 的 base_url 是否可连"><span class="dot"></span>LLM</div>

<script>
const msgEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const stopBtn = document.getElementById('stopBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const stateChips = Array.from(document.querySelectorAll('.state-chip'));
function setAppState(s) { stateChips.forEach(c => c.classList.toggle('active', c.dataset.state === s)); }
const seenEvents = new Set();
let lastStopAt = 0;
const toolLog = document.getElementById('toolLog');
const toolEmpty = document.getElementById('toolEmpty');
const liveFeed = document.getElementById('liveFeed');
const liveEmpty = document.getElementById('liveEmpty');
const modelSelect = document.getElementById('modelSelect');
const muteBtn = document.getElementById('muteBtn');
const activityBar = document.getElementById('activityBar');
const activityText = document.getElementById('activityText');
const activitySteps = document.getElementById('activitySteps');
const reactor = document.getElementById('reactor');
const reactorLabel = document.getElementById('reactorLabel');

let ws = null;
let thinking = false;
let isMuted = false;
let toolStepCount = 0;
let pendingWebText = null;

document.querySelectorAll('.side-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.side-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  };
});

async function loadMuteState() {
  try { const r = await fetch('/api/mute'); const d = await r.json(); isMuted = d.muted; updateMuteUI(); } catch(e) {}
}
function updateMuteUI() { muteBtn.classList.toggle('muted', isMuted); }
muteBtn.onclick = async () => {
  try { const r = await fetch('/api/mute', { method: 'POST' }); const d = await r.json(); isMuted = d.muted; updateMuteUI(); } catch(e) {}
};

async function loadProviders() {
  try {
    const resp = await fetch('/api/providers');
    const data = await resp.json();
    modelSelect.innerHTML = '';
    for (const [key, prov] of Object.entries(data.providers)) {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = prov.label;
      if (key === data.active) opt.selected = true;
      modelSelect.appendChild(opt);
    }
  } catch (e) {}
}
modelSelect.onchange = async () => {
  try {
    const resp = await fetch('/api/providers/' + modelSelect.value, { method: 'POST' });
    const data = await resp.json();
    if (data.status === 'ok') addMsg('system', '切换: ' + modelSelect.options[modelSelect.selectedIndex].text);
  } catch (e) {}
};

function setReactorState(state) {
  reactor.className = 'reactor';
  switch(state) {
    case 'thinking': reactor.classList.add('thinking'); reactorLabel.textContent = '处理中'; break;
    case 'listening': reactor.classList.add('listening'); reactorLabel.textContent = '聆听中'; break;
    case 'speaking': reactor.classList.add('speaking'); reactorLabel.textContent = '说话中'; break;
    case 'offline': reactorLabel.textContent = '已离线'; break;
    default: reactorLabel.textContent = '待命';
  }
}


function showActivity(text) { activityBar.classList.add('active'); activityText.textContent = text.toUpperCase(); }
function hideActivity() { activityBar.classList.remove('active'); toolStepCount = 0; activitySteps.innerHTML = ''; }
function addActivityStep() {
  toolStepCount++;
  activitySteps.innerHTML = '';
  for (let i = 0; i < toolStepCount; i++) { const d = document.createElement('div'); d.className = 'activity-step done'; activitySteps.appendChild(d); }
  const n = document.createElement('div'); n.className = 'activity-step active'; activitySteps.appendChild(n);
}

let wsPing = null;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { statusDot.className = 'status-dot online'; statusText.textContent = '待命中'; setReactorState('idle'); setAppState('idle'); loadProviders(); loadMuteState(); loadHistory();
    // Heartbeat keeps the socket lively and history is re-pulled on every
    // (re)connect, so a quiet socket drop does not leave the page stale until a
    // manual reload (records/2026-11-08-19-25-48.md).
    clearInterval(wsPing);
    wsPing = setInterval(() => { try { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'ping' })); } catch (e) {} }, 20000);
  };
  ws.onclose = () => { statusDot.className = 'status-dot'; statusText.textContent = '已离线'; setReactorState('offline'); setAppState('offline'); hideActivity(); clearInterval(wsPing); setTimeout(connect, 3000); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    console.log('[WS]', msg.type, msg.text || msg.message || '');
    switch (msg.type) {
      case 'connected': addMsg('system', msg.message.toUpperCase()); break;
      case 'status':
        // The backend broadcasts Chinese status strings (jarvis/main.py: 思考中…,
        // 正在聆听…, 正在说话…, 在。, 已停止。, 就绪。, 主模型失败：…). Matching only the
        // English literals left the dot/activity/status text permanently idle,
        // so the page looked frozen until a manual reload (user report
        // 2026-11-08-20-22, records/2026-11-08-19-25-48.md).
        const st = msg.message || '';
        if (st === '思考中…' || st === 'Thinking...') { setThinking(true); showActivity('分析中'); setReactorState('thinking'); setAppState('thinking'); setStatusText('处理中'); }
        else if (st === '正在聆听…' || st === 'Listening...') { setThinking(false); hideActivity(); setReactorState('listening'); setAppState('listening'); setStatusText('聆听中'); }
        else if (st === '正在说话…' || st === 'Speaking...') { setThinking(false); hideActivity(); setReactorState('speaking'); setAppState('speaking'); setStatusText('说话中'); }
        else if (st === '在。') { setThinking(false); setReactorState('listening'); setAppState('listening'); setStatusText('在。'); addMsg('system', '🎙 在。'); }
        else if (st === 'Wake.') { setThinking(false); hideActivity(); setReactorState('listening'); setAppState('listening'); setStatusText('聆听中'); addMsg('system', '🎤 聆听中…'); }
        else if (st === '已停止。' || st === 'Stopped.') {
          setThinking(false); hideActivity(); setReactorState('idle'); setAppState('idle'); setStatusText('待命');
          // One 已停止 bubble per turn: abort_all() can fire several times inside a
          // turn (wake barge-in + UI 中止 + WS interrupt), and the UI used to add 2-3
          // 「已停止」 bubbles (records/2026-11-08-20-44-17).
          const nowMs = Date.now();
          if (nowMs - lastStopAt > 4000) { lastStopAt = nowMs; addMsg('system', '⏹ 已停止'); }
        }
        else if (st.startsWith('主模型失败')) { setThinking(true); setAppState('thinking'); showActivity('备用模型'); setStatusText('主模型失败，改用备用…'); addMsg('system', '⚠ ' + st); }
        else if (st === '就绪。' || st === 'Ready.') { setThinking(false); hideActivity(); setReactorState('idle'); setAppState('idle'); setStatusText('待命'); }
        else { setThinking(false); hideActivity(); setReactorState('idle'); setAppState('idle'); setStatusText(st || '待命'); }
        break;
      case 'user': {
        const isOurs = pendingWebText && pendingWebText === msg.text;
        if (!isOurs) addMsg('user', msg.text, 'voice');
        pendingWebText = null;
        addLiveFeed('user', msg.text);
        seenEvents.add('user|' + msg.text);   // keep the 2s poller from duplicating
        break;
      }
      case 'wake': addLiveFeed('system', '[WAKE] ' + (msg.text || '')); seenEvents.add('wake|' + (msg.text || '')); break;
      case 'tool': setAppState('acting'); setStatusText('工具: ' + msg.name.toUpperCase()); showActivity('执行: ' + msg.name); addActivityStep(); addToolCall(msg.name, msg.args); addLiveFeed('tool', '[Tool: ' + msg.name + ']'); break;
      case 'tool_result': updateToolResult(msg.name, msg.result); break;
      case 'response': setThinking(false); hideActivity(); setReactorState('speaking'); setAppState('speaking'); setStatusText('说话中'); addMsg('assistant', msg.text); addLiveFeed('assistant', msg.text); seenEvents.add('assistant|' + msg.text); break;
      case 'mute': isMuted = msg.muted; updateMuteUI(); addMsg('system', msg.muted ? '🔇 已静音' : '🔊 已解除静音'); break;
      case 'provider_changed': loadProviders(); break;
    }
  };
}

function setThinking(on) {
  thinking = on; sendBtn.disabled = on;
  statusDot.className = on ? 'status-dot thinking' : 'status-dot online';
}
function setStatusText(text) {
  statusText.textContent = text;
}

function addMsg(role, text, source) {
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-wrapper ' + (role === 'user' ? 'right' : role === 'system' ? 'center' : 'left');
  if (source && role !== 'system') {
    const srcLabel = document.createElement('div');
    srcLabel.className = 'msg-source ' + source;
    srcLabel.textContent = source === 'voice' ? '语音输入' : '网页输入';
    wrapper.appendChild(srcLabel);
  }
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  wrapper.appendChild(div);
  msgEl.appendChild(wrapper);
  msgEl.scrollTop = msgEl.scrollHeight;
}

function addToolCall(name, args) {
  toolEmpty.style.display = 'none';
  const div = document.createElement('div'); div.className = 'msg-wrapper left';
  const inner = document.createElement('div'); inner.className = 'msg tool-call';
  const argStr = typeof args === 'object' ? JSON.stringify(args) : String(args);
  inner.innerHTML = '<span class="tool-name">' + esc(name) + '</span>(' + esc(argStr.slice(0, 120)) + ')';
  inner.id = 'tool-' + Date.now();
  div.appendChild(inner); msgEl.appendChild(div); msgEl.scrollTop = msgEl.scrollHeight;
  const entry = document.createElement('div'); entry.className = 'tool-log-entry';
  entry.innerHTML = '<span class="tl-name">' + esc(name) + '</span>';
  entry.id = 'tl-' + name + '-' + Date.now();
  toolLog.prepend(entry);
}

function updateToolResult(name, result) {
  const toolMsgs = msgEl.querySelectorAll('.msg.tool-call');
  if (toolMsgs.length > 0) { const last = toolMsgs[toolMsgs.length - 1]; const res = document.createElement('div'); res.className = 'tool-result'; res.textContent = result.slice(0, 200); last.appendChild(res); }
  const entries = toolLog.querySelectorAll('.tool-log-entry');
  if (entries.length > 0) { const resDiv = document.createElement('div'); resDiv.className = 'tl-result'; resDiv.textContent = result.slice(0, 100); entries[0].appendChild(resDiv); }
  showActivity('处理结果');
}

function addLiveFeed(type, text) {
  liveEmpty.style.display = 'none';
  const div = document.createElement('div'); div.className = 'feed-entry feed-' + type;
  div.textContent = text.length > 200 ? text.slice(0, 200) + '...' : text;
  liveFeed.appendChild(div); liveFeed.scrollTop = liveFeed.scrollHeight;
  while (liveFeed.children.length > 101) liveFeed.removeChild(liveFeed.children[1]);
}

let _historyLoaded = false;
async function loadHistory() {
  if (_historyLoaded) return;
  _historyLoaded = true;
  try {
    const r = await fetch('/api/events?limit=100');
    const d = await r.json();
    for (const ev of d.events || []) {
      const time = (ev.ts || '').slice(5, 16);
      seenEvents.add(ev.kind + '|' + (ev.text || ''));
      if (ev.kind === 'user') addMsg('user', ev.text, ev.source || 'voice');
      else if (ev.kind === 'assistant') addMsg('assistant', ev.text, ev.source || 'voice');
      else addLiveFeed('system', '[' + time + '] ' + (ev.text || ev.kind));
    }
  } catch (e) {}
}

// Live content needs a channel that survives a dead WebSocket: the page pulls
// /api/events every 2s and renders anything unseen (user report 2026-11-08-20-44-17,
// records/2026-11-08-20-44-17.md — WS-only rendering meant content appeared only
// after a manual reload).
async function pollEvents() {
  try {
    const r = await fetch('/api/events?limit=30');
    const d = await r.json();
    for (const ev of (d.events || []).slice().reverse()) {
      const key = ev.kind + '|' + (ev.text || '');
      if (seenEvents.has(key)) continue;
      seenEvents.add(key);
      const time = (ev.ts || '').slice(5, 16);
      if (ev.kind === 'user') addMsg('user', ev.text, ev.source || 'voice');
      else if (ev.kind === 'assistant') addMsg('assistant', ev.text, ev.source || 'voice');
      else addLiveFeed('system', '[' + time + '] ' + (ev.text || ev.kind));
    }
    while (seenEvents.size > 300) seenEvents.delete(seenEvents.values().next().value);
  } catch (e) {}
}
setInterval(pollEvents, 2000);

// 服务三盏灯（语音识别 / LLM / TTS）：5 s 拉一次 /api/health
// （用户定稿 2026-11-09-15-37-58：状态显示器右边加「语音识别/LLM/TTS 是否在线」）。
// asr 在 jarvis 进程内（whisper 首次识别后才常驻）→ 用 warm 黄灯；llm/tts 是
// 外部服务（:8080 / :9880）→ 连不上就灰灯。
const lamps = { asr: document.getElementById('lamp-asr'), llm: document.getElementById('lamp-llm'), tts: document.getElementById('lamp-tts') };
function setLamp(el, cls, title) {
  if (!el) return;
  el.classList.remove('on'); el.classList.remove('off'); el.classList.remove('warm');
  el.classList.add(cls);
  if (title) el.title = title;
}
async function pollHealth() {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    for (const k of ['asr', 'llm', 'tts']) {
      const s = d[k] || {};
      if (!s.online) setLamp(lamps[k], 'off', (s.detail || '') + '（离线）');
      else if (k === 'asr' && s.warm === false) setLamp(lamps[k], 'warm', s.detail || '');
      else setLamp(lamps[k], 'on', s.detail || '');
    }
  } catch (e) {
    for (const k of ['asr', 'llm', 'tts']) setLamp(lamps[k], 'off', '无法连接 Jarvis 服务（:7860）');
  }
}
pollHealth();
setInterval(pollHealth, 5000);

function esc(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

function send() {
  const text = inputEl.value.trim();
  if (!text || !ws) return;
  pendingWebText = text;
  addMsg('user', text, 'web');
  ws.send(JSON.stringify({ type: 'chat', text }));
  inputEl.value = '';
}

sendBtn.onclick = send;
inputEl.onkeydown = (e) => { if (e.key === 'Enter') send(); };
stopBtn.onclick = () => { if (ws) ws.send(JSON.stringify({ type: 'interrupt' })); hideActivity(); setReactorState('idle'); setAppState('idle'); setStatusText('待命'); };
document.querySelectorAll('.quick-btn').forEach(btn => { btn.onclick = () => { inputEl.value = btn.dataset.cmd; send(); }; });

// ─── Settings & Provider Management ───

let _providersData = {};
let _activeProvider = '';

async function loadSettings() {
  try {
    const r = await fetch('/api/settings');
    const d = await r.json();
    document.getElementById('s-temperature').value = d.llm?.temperature ?? 0.7;
    document.getElementById('s-tts-voice').value = d.tts?.voice ?? '';
    document.getElementById('s-tts-speed').value = d.tts?.speed ?? '';
    document.getElementById('s-stt-model').value = d.stt?.model ?? 'small';
    document.getElementById('s-stt-device').value = d.stt?.device ?? 'cpu';
    document.getElementById('s-wake-threshold').value = d.wake_word?.threshold ?? 0.5;
  } catch(e) { console.error('loadSettings', e); }
}

async function saveSettings() {
  const body = {
    llm: { temperature: parseFloat(document.getElementById('s-temperature').value) || 0.7 },
    tts: {
      voice: document.getElementById('s-tts-voice').value,
      speed: parseFloat(document.getElementById('s-tts-speed').value) || 1.1,
    },
    stt: {
      model: document.getElementById('s-stt-model').value,
      device: document.getElementById('s-stt-device').value,
    },
    wake_word: { threshold: parseFloat(document.getElementById('s-wake-threshold').value) || 0.5 },
  };
  try {
    await fetch('/api/settings', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const toast = document.getElementById('saveToast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  } catch(e) { console.error('saveSettings', e); }
}

async function loadProvidersFull() {
  try {
    const r = await fetch('/api/providers');
    const d = await r.json();
    _providersData = d.providers;
    _activeProvider = d.active;
    renderProviders();
  } catch(e) {}
}

function renderProviders() {
  const el = document.getElementById('providersList');
  el.innerHTML = '';
  for (const [key, p] of Object.entries(_providersData)) {
    const isActive = key === _activeProvider;
    const card = document.createElement('div');
    card.className = 'provider-card' + (isActive ? ' active-provider' : '');
    card.innerHTML =
      '<div class="provider-card-header">' +
        '<span class="provider-card-name">' + esc(p.label || key) + (isActive ? ' <span class="provider-card-badge">使用中</span>' : '') + '</span>' +
        '<div class="provider-card-actions">' +
          (isActive ? '' : '<button title="启用" onclick="activateProvider(\'' + esc(key) + '\')">&#9654;</button>') +
          '<button title="编辑" onclick="openProviderModal(\'' + esc(key) + '\')">&#9998;</button>' +
          (isActive ? '' : '<button class="del-btn" title="删除" onclick="deleteProvider(\'' + esc(key) + '\')">&#10006;</button>') +
        '</div>' +
      '</div>' +
      '<div class="provider-card-detail">' + esc(p.type) + ' &middot; ' + esc(p.model || '—') + '</div>';
    el.appendChild(card);
  }
}

async function activateProvider(key) {
  try {
    const r = await fetch('/api/providers/' + key, { method: 'POST' });
    const d = await r.json();
    if (d.status === 'ok') {
      _activeProvider = key;
      renderProviders();
      loadProviders();
      addMsg('system', '切换: ' + (_providersData[key]?.label || key));
    }
  } catch(e) {}
}

function openProviderModal(editKey) {
  const modal = document.getElementById('providerModal');
  const title = document.getElementById('modalTitle');
  const keyInput = document.getElementById('pm-key');
  const editHidden = document.getElementById('pm-editing-key');
  if (editKey && _providersData[editKey]) {
    const p = _providersData[editKey];
    title.textContent = '编辑提供方';
    editHidden.value = editKey;
    keyInput.value = editKey;
    keyInput.disabled = true;
    document.getElementById('pm-label').value = p.label || '';
    document.getElementById('pm-type').value = p.type || 'openai';
    document.getElementById('pm-model').value = p.model || '';
    document.getElementById('pm-url').value = p.base_url || '';
    document.getElementById('pm-apikey').value = '';
  } else {
    title.textContent = '新增提供方';
    editHidden.value = '';
    keyInput.value = '';
    keyInput.disabled = false;
    document.getElementById('pm-label').value = '';
    document.getElementById('pm-type').value = 'openai';
    document.getElementById('pm-model').value = '';
    document.getElementById('pm-url').value = '';
    document.getElementById('pm-apikey').value = '';
  }
  modal.classList.add('show');
}

function closeProviderModal() {
  document.getElementById('providerModal').classList.remove('show');
}

async function saveProvider() {
  const editKey = document.getElementById('pm-editing-key').value;
  const key = editKey || document.getElementById('pm-key').value.trim().replace(/\s+/g, '_');
  if (!key) return;
  const body = {
    label: document.getElementById('pm-label').value || key,
    type: document.getElementById('pm-type').value,
    model: document.getElementById('pm-model').value,
    base_url: document.getElementById('pm-url').value,
  };
  const apiKey = document.getElementById('pm-apikey').value;
  if (apiKey) body.api_key = apiKey;
  try {
    await fetch('/api/providers/' + key, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    closeProviderModal();
    await loadProvidersFull();
    loadProviders();
  } catch(e) { console.error('saveProvider', e); }
}

async function deleteProvider(key) {
  if (!confirm('删除提供方「' + key + '」？')) return;
  try {
    const r = await fetch('/api/providers/' + key, { method: 'DELETE' });
    const d = await r.json();
    if (d.status === 'ok') { await loadProvidersFull(); loadProviders(); }
    else alert(d.message || 'Cannot delete');
  } catch(e) {}
}

// Load settings when Config tab is opened
document.querySelector('[data-tab="settings"]').addEventListener('click', () => {
  loadSettings();
  loadProvidersFull();
});

connect();
</script>
