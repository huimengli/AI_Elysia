    # 能量门（records/2026-11-12-22-51-09.md 3 轮 A/B 后落地）：sherpa 无 VAD，静音件会吐乱码。
    # energy_mode: span = 只掐头尾静音、保留中间全部内容（100 ms 窗 RMS，前后各留 100 ms）。
    # concat（逐窗拼接）已否决 —— 100 ms 窗会在轻声/擦音中间切，已知集 2/6 打到 1/6。
    # 阈值必须低：0.015 会切掉轻声音节（电视机→电脑），0.008 复原全部已知件、乱码 0、耗时减半。
